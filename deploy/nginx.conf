# Template site nginx MoodBite. Ganti __DOMAIN__ lalu pasang HTTPS dengan:
#   sudo certbot --nginx -d __DOMAIN__ --redirect
# Certbot menambahkan blok 443 + sertifikat dan mengalihkan HTTP ke HTTPS.
# Jangan menaruh add_header di dalam location: itu menimpa header di tingkat server.

limit_req_zone $binary_remote_addr zone=moodbite_login:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  root /var/www/moodbite;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /api/auth/login {
    limit_req zone=moodbite_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
